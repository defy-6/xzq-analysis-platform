 docx.Document('.reasonix/attachments/clipboard-20260802-212637.198892-000001.docx')\n\nW = '{http://schemas.openxmlformats.org/wordprocessingml/2006/main}'\ndef show(par, label):\n    pPr = par._p.find(W+'pPr')\n    print(f\"=== {label} pPr ===\")\n    if pPr is None:\n        print(\"  (无 pPr)\"); return\n    print(etree.tostring(pPr, pretty_print=True).decode())\n\nshow(d.paragraphs[1], \"P1 核心结论\")\nshow(d.paragraphs[3], \"P3 正文\")\nshow(d.paragraphs[78], \"P78 Heading2(4.1)\")\nshow(d.paragraphs[2], \"P2 Heading2(1.1)\")\n\n# run 级 rPr：P3 的 run\nprint(\"=== P3 run rPr ===\")\nfor r in d.paragraphs[3].runs[:2]:\n    rPr = r._r.find(W+'rPr')\n    print(etree.tostring(rPr, pretty_print=True).decode() if rPr is not None else \"(无rPr)\")\nEOF"]
